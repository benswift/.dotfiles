# Rotate the logs the launchd jobs and msmtp append to forever: mailsync every
# five minutes, the hourly pushes and syncs, msmtp on every send. Size-triggered
# (1000 KB), five compressed generations kept. bin/launchd-run only tails the
# last 20 lines for its page, so rotation can't starve it.
#
# Install (macOS only; newsyslog runs from /etc/newsyslog.d via launchd):
#
#   sudo cp ~/.dotfiles/newsyslog/jobs.conf /etc/newsyslog.d/benswift-jobs.conf
#   sudo newsyslog -nv -f /etc/newsyslog.d/benswift-jobs.conf   # dry run
#
# logfilename                                 [owner:group]  mode  count  size  when  flags
/Users/ben/Library/Logs/mailsync.log          ben:staff      644   5      1000  *     J
/Users/ben/Library/Logs/push-to-weddle.log    ben:staff      644   5      1000  *     J
/Users/ben/Library/Logs/nb-sync.log           ben:staff      644   5      1000  *     J
/Users/ben/.local/state/msmtp/msmtp.log       ben:staff      600   5      1000  *     J
