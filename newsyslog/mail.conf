# Rotate the mail logs that otherwise grow forever: the launchd mailsync job
# appends every five minutes, and msmtp logs every send. Size-triggered
# (1000 KB), five compressed generations kept. bin/mailsync-scheduled only
# tails the last 20 lines for its Pushover page, so rotation can't starve it.
#
# Install (macOS only; newsyslog runs from /etc/newsyslog.d via launchd):
#
#   sudo cp ~/.dotfiles/newsyslog/mail.conf /etc/newsyslog.d/benswift-mail.conf
#   sudo newsyslog -nv -f /etc/newsyslog.d/benswift-mail.conf   # dry run
#
# logfilename                                 [owner:group]  mode  count  size  when  flags
/Users/ben/Library/Logs/mailsync.log          ben:staff      644   5      1000  *     J
/Users/ben/.local/state/msmtp/msmtp.log       ben:staff      600   5      1000  *     J
