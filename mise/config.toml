[tools]
rust = "latest"
uv = "latest"
node = "lts"
# For repos without a mise.toml. A project declares its own pnpm, and its
# committed mise.lock decides the version.
pnpm = "latest"
bun = "latest"
# Node CLIs via the npm backend rather than `bun install -g`. A bun-global
# package lands in ~/.bun/bin, which only an interactive shell has on PATH (via
# zshenv), so a systemd unit declaring an explicit PATH silently misses it ---
# how a crit sweep recorded a whole group's screenshots as failed with no
# browser ever launched. The npm backend shims these into mise's own bin dir,
# which every unit already resolves first.
"npm:agent-browser" = "latest"
"npm:backlog.md" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
yazi = "latest"
# Zellij still misroutes attach-time host replies into the focused pane
# (zellij-org/zellij#5365, fix PR #5375 unmerged as of v0.45.1). Codex >= 0.148
# discards the stray reply instead of wedging on it, so the prebuilt release is
# fine again; TASK-033 tracks the upstream fix.
zellij = "latest"
zoxide = "latest"
# helix is deliberately absent: bin/helix-build compiles it from the main
# commit pinned in helix/pinned-rev, because upstream has not tagged a
# release since 25.07.1 and ships no nightly. Do not add it back --- mise
# activate puts its bin dir ahead of ~/.local/bin, so a mise-managed helix
# silently shadows the source build.
# Antigravity CLI, Gemini CLI's successor.
agy = "latest"
codex = "latest"
glab = "latest"
typst = "latest"
# Via mise rather than apt so the typst writer is current --- Ubuntu's pandoc
# (3.1.3) emits pre-typst-0.9 #cite syntax that typst 0.15 rejects.
pandoc = "latest"
ast-grep = "latest"
jq = "latest"
fd = "latest"
# bin/zj-switch's picker. Via mise rather than apt/brew so both platforms get
# the same (and a current) fzf --- Debian ships 0.44, from 2023.
fzf = "latest"
# bin/ts-cat's fallback previewer. Via mise rather than brew/apt so the binary
# is called `bat` on both platforms (Debian's package installs it as `batcat`).
bat = "latest"
# git's pager (gitconfig). Via mise rather than apt so both platforms get a
# current delta --- Ubuntu ships 0.16.
delta = "latest"
# bin/ts-cat's highlighter (tree-sitter with nvim-treesitter queries; WASM
# parsers cached in ~/.local/share/lumis by bin/lumis-parsers). The supported
# npm CLI installs the matching prebuilt `lumis` binary for each platform as an
# optional dependency. Pinned because its subcommands still move between minor
# releases, and bin/lumis-parsers and bin/ts-cat call them by name.
"npm:@lumis-sh/cli" = { version = "0.6.4", allow_low_downloads = true }
# Editor tooling invoked as bare binaries (helix LSP/formatters and the
# bin/claude-format hook), never via `uv run`, so they must be on PATH globally.
ruff = "latest"
ty = "latest"
marksman = "latest"
# Elixir's language server. One bare release binary per platform, so aqua (the
# registry default) covers both hosts.
expert = "latest"
rclone = "latest"
# The private overlay's backups. Pinned, not latest: every host reads and
# writes the same repo, so a new release should land deliberately.
restic = "0.19.1"
# mergiraf is Codeberg-only (no GitHub releases, not in mise's registry), so
# it's the one formatter here with no cross-platform prebuilt binary --- cargo
# compiles it everywhere. The rest below pull prebuilt release binaries.
"cargo:mergiraf" = "latest"
oxipng = "latest"
"github:WGUNDERWOOD/tex-fmt" = { version = "latest", exe = "tex-fmt" }
"github:hougesen/kdlfmt" = { version = "latest", exe = "kdlfmt" }
flyctl = "latest"
oxfmt = "latest"
typstyle = "latest"
# headless-terminal MCP server (drives neomutt and other TUIs from Claude
# Code). Release ships bare per-target binaries, so pin the exe name.
"github:memextech/ht-mcp" = { version = "latest", exe = "ht-mcp" }
# linting for this repo's own bash scripts (bin/*, lib/*)
shellcheck = "latest"
# bin/check-secrets' scanner
gitleaks = "latest"
gh = "latest"
# Read and send iMessage/SMS from the CLI: reads ~/Library/Messages/chat.db
# (so the host terminal needs Full Disk Access) and sends through Messages.app
# automation. macOS only --- the Linux build just reads a copied chat.db.
# Pinned because it reads every message and can send as me, so a new release
# should land deliberately. Leave its IMCore features alone (read receipts,
# typing, message edits): they inject a helper into Messages.app and need SIP
# off.
"github:openclaw/imsg" = { version = "0.15.10", os = ["macos"] }
trufflehog = "3.97.9"

[settings]
idiomatic_version_file_enable_tools = []
