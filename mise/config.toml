[tools]
rust = "latest"
uv = "latest"
node = "lts"
# Machine-level bootstrap only, so `mise exec -- pnpm` resolves in every repo
# (including ones that deliberately keep pnpm out of their own mise.toml).
# It does not decide the version: pnpm self-switches to a repo's
# package.json `packageManager` pin when there is one. Hence "latest" --- a
# pin here would just be a second, staler answer to a question the repo owns.
pnpm = "latest"
bun = "latest"
# Node CLIs via the npm backend rather than `bun install -g`. A bun-global
# package lands in ~/.bun/bin, which only an interactive shell has on PATH (via
# zshenv), so a systemd unit declaring an explicit PATH silently misses it ---
# how a crit sweep recorded a whole group's screenshots as failed with no
# browser ever launched. The npm backend shims these into mise's own bin dir,
# which every unit already resolves first.
"npm:agent-browser" = "latest"
"npm:backlog.md" = "latest"
# Matilda Code, Maincode's coding agent CLI (a Gemini-CLI fork). Published
# only to npm, so the npm backend is the only route; the native optional deps
# (node-pty, clipboard) ship prebuilt for linux-x64 and darwin-arm64, and its
# postinstall only prints a PATH tip, so nothing is compiled on either host.
"npm:@maincode-ai/matilda-code" = { version = "latest", allow_low_downloads = true, allow_builds = [
  "@maincode-ai/matilda-code",
] }
yazi = "latest"
# Chromium rendered into a kitty-graphics terminal (ghostty qualifies). Via the
# github backend rather than the upstream curl|bash installer, so it is pinned
# here like every other tool --- don't run `terminal-browser upgrade`, it
# rewrites the install out from under mise. The tarball bundles its own
# agent-browser under agent-browser/bin, which mise does not put on PATH, so
# the npm:agent-browser above stays the one that answers.
# On Linux where /proc/sys/kernel/apparmor_restrict_unprivileged_userns is 1
# (Ubuntu 24.04+), chromium's sandbox needs an AppArmor profile: run the
# bundled `scripts/apparmor.sh` (sudo) from the install dir. The profile is
# keyed on the electron binary's path, so re-run it after every version bump.
"github:zenbu-labs/terminal-browser" = "latest"
# Zellij still misroutes attach-time host replies into the focused pane,
# poisoning Codex's input parser so even Ctrl-C is swallowed after a session
# switch (zellij-org/zellij#5365). Verified 2026-08-21: v0.45.0 still fails the
# upstream fix's own regression test, and that fix (PR #5375) is unmerged and
# conflicted. This pins the PR rebased onto the v0.45.0 tag; return to
# `zellij = "latest"` once it ships upstream (TASK-033). A git source has no
# prebuilt artefact, so this intentionally compiles once per platform.
"cargo:https://github.com/benswift/zellij" = { version = "rev:1524095119990bc7af283296bbe291a3b4cffbcd", crate = "zellij", install_env = { CARGO_NET_GIT_FETCH_WITH_CLI = "true" } }
zoxide = "latest"
helix = "latest"
vivid = "latest"
gemini = "latest"
codex = "latest"
# Grok Build, xAI's coding agent CLI. The aqua backend installs the same
# release binary the x.ai/cli/install.sh one-liner fetches, so this pins it
# alongside every other agent rather than leaving one CLI self-updating.
grok = "latest"
glab = "latest"
typst = "latest"
# Via mise rather than apt so the typst writer is current --- Ubuntu's pandoc
# (3.1.3) emits pre-typst-0.9 #cite syntax that typst 0.15 rejects.
pandoc = "latest"
ast-grep = "latest"
jq = "latest"
fd = "latest"
# The notebook's operational layer. Pin rather than tracking latest: scheduled
# agents and sync jobs depend on nb's filename, todo, and git semantics, so an
# upstream change should land here deliberately and pass tests/test_nb.py
# before reaching every host. The release is one signed portable script; mise's
# GitHub backend installs its `nb` asset directly on both macOS and Linux.
"github:xwmx/nb" = { version = "7.25.5", exe = "nb" }
# bin/zj-switch's picker. Via mise rather than apt/brew so both platforms get
# the same (and a current) fzf --- Debian ships 0.44, from 2023.
fzf = "latest"
# bin/ts-cat's fallback previewer. Via mise rather than brew/apt so the binary
# is called `bat` on both platforms (Debian's package installs it as `batcat`).
bat = "latest"
# bin/ts-cat's highlighter (tree-sitter with nvim-treesitter queries; WASM
# parsers cached in ~/.local/share/lumis by bin/lumis-parsers). The supported
# npm CLI installs the matching prebuilt `lumis` binary for each platform. Pin
# 0.4.1: the newer npm wrapper requests an as-yet unpublished CLI release.
"npm:@lumis-sh/cli" = { version = "0.4.1", allow_low_downloads = true, allow_builds = [
  "@lumis-sh/cli",
] }
# Editor tooling invoked as bare binaries (helix LSP/formatters and the
# bin/claude-format hook), never via `uv run`, so they must be on PATH globally.
ruff = "latest"
ty = "latest"
marksman = "latest"
rclone = "latest"
# mergiraf is Codeberg-only (no GitHub releases, not in mise's registry), so
# it's the one formatter here with no cross-platform prebuilt binary --- cargo
# compiles it everywhere. The rest below pull prebuilt release binaries.
"cargo:mergiraf" = "latest"
oxipng = "latest"
"github:WGUNDERWOOD/tex-fmt" = { version = "latest", exe = "tex-fmt" }
"github:hougesen/kdlfmt" = { version = "latest", exe = "kdlfmt" }
flyctl = "latest"
oxfmt = "latest"
typstyle = "latest"
# headless-terminal MCP server (drives neomutt and other TUIs from Claude
# Code). Release ships bare per-target binaries, so pin the exe name.
"github:memextech/ht-mcp" = { version = "latest", exe = "ht-mcp" }
# linting for this repo's own bash scripts (bin/*, lib/*)
shellcheck = "latest"
# bin/check-secrets' scanner
gitleaks = "latest"
gh = "latest"
trufflehog = "3.96.0"

[settings]
idiomatic_version_file_enable_tools = []

# Exported into every shell mise touches --- including via the shims, so a
# systemd unit or other non-interactive caller gets it too.
[env]
# Matilda's settings layer three deep: SystemDefaults < User < Workspace.
# ~/.matilda/settings.json (User) is Matilda's own file --- `auth login` writes
# the selected provider, the model and the UI name back into it, and an atomic
# rewrite replaces a symlink with a real file, so tracking it doesn't hold. The
# portable half instead goes in the lowest layer, which Matilda reads but never
# writes, and which this points at directly in the repo (no symlink needed).
# The file ships already stamped "$version": 5 in Matilda's own byte format;
# an unstamped one gets migrated in place on first run, leaving a modified
# file and a stray .orig beside it.
MATILDA_CODE_SYSTEM_DEFAULTS_PATH = "{{env.HOME}}/.dotfiles/matilda/system-defaults.json"
