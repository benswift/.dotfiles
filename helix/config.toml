# ANSI-only, so helix takes the terminal's palette like everything else.
theme = "term16_dark"

[editor]
cursorline = true
auto-save = true
bufferline = "multiple"
color-modes = true
# term16's popups share the editor background, so they need an edge.
popup-border = "all"
gutters = ["diagnostics", "diff"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.soft-wrap]
# enable = true
wrap-at-text-width = true

[keys.normal]
D = ["extend_to_line_end", "delete_selection"]
C-ret = ":pipe-to xtm-send"

[keys.normal.space]
f = ":write"
v = "file_picker"
x = ":write-quit"
# y = "yank_to_clipboard"
# p = "paste_clipboard_after"
# P = "paste_clipboard_before"

# [keys.select]
# y = "yank_to_clipboard"
# p = "paste_clipboard_after"
# P = "paste_clipboard_before"

[keys.normal.g]
o = "jump_forward"
O = "jump_backward"
