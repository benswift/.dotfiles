# ANSI-only, so helix takes the terminal's palette like everything else.
theme = "term16_dark"

[editor]
cursorline = true
auto-save = true
bufferline = "multiple"
color-modes = true
# term16's popups share the editor background, so they need an edge.
popup-border = "all"
gutters = ["diagnostics", "diff"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.soft-wrap]
# enable = true
wrap-at-text-width = true

[keys.normal]
D = ["extend_to_line_end", "delete_selection"]

[keys.normal.space]
f = ":write"
v = "file_picker"
x = ":write-quit"
# y = "yank_to_clipboard"
# p = "paste_clipboard_after"
# P = "paste_clipboard_before"

# [keys.select]
# y = "yank_to_clipboard"
# p = "paste_clipboard_after"
# P = "paste_clipboard_before"

# Evaluate in a running extempore through its language server (extempore lsp).
# Helix counts lines from 1 and LSP from 0, hence the %sh arithmetic. `,e` sends
# the selection's whole lines when it spans several, and otherwise an empty
# range, which the server takes as the top-level form at the cursor.
[keys.normal.","]
e = ':lsp-workspace-command extempore.eval {"uri":"file://%{file_path_absolute}","range":{"start":{"line":%sh{echo $((%{selection_line_start}-1))},"character":0},"end":{"line":%sh{echo $((%{selection_line_start}==%{selection_line_end}?%{selection_line_start}-1:%{selection_line_end}))},"character":0}}}'
b = ':lsp-workspace-command extempore.evalBuffer {"uri":"file://%{file_path_absolute}"}'
i = ':lsp-workspace-command extempore.interrupt'

[keys.select.","]
e = ':lsp-workspace-command extempore.eval {"uri":"file://%{file_path_absolute}","range":{"start":{"line":%sh{echo $((%{selection_line_start}-1))},"character":0},"end":{"line":%sh{echo $((%{selection_line_start}==%{selection_line_end}?%{selection_line_start}-1:%{selection_line_end}))},"character":0}}}'

[keys.normal.g]
o = "jump_forward"
O = "jump_backward"
