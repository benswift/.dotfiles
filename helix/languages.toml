[[language]]
name = "python"
language-servers = ["ruff", "ty"]
auto-format = true

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]

[[language]]
name = "elixir"
language-servers = ["elixir-ls"]
auto-format = true

[[language]]
name = "heex"
language-servers = ["elixir-ls"]
auto-format = true

[language-server.elixir-ls]
command = "elixir-ls"

[language-server.nb-lsp]
command = "nb-lsp"

# harper-ls: grammar checker for prose (disabled by default---too noisy)
# to enable, add "harper-ls" to language-servers below and uncomment:
# [language-server.harper-ls]
# command = "harper-ls"
# args = ["--stdio"]
# [language-server.harper-ls.config.harper-ls]
# dialect = "Australian"

# astromotion decks: skip auto-format because prettier/oxfmt mangle multi-line
# MDX expression containers like `{/* notes: ...\n<ol>...</ol>\n*/}` (the
# leading `*` gets escaped to `\*` and a blank line is inserted before the
# content). Single-line `{/* _class: hero */}` survives correctly *if* oxfmt
# is told the file is .mdx (see the dedicated mdx rule below), but multi-line
# cases are a known prettier behaviour, so we just skip auto-format here.
# Covers both parent decks (`*.deck.mdx`, routed by astromotion) and partials
# (`*.mdx` files under any `decks/` subtree, included via `@include`).
# Highlighting/injections inherit from markdown via
# ~/.config/helix/runtime/queries/astromotion-deck/
[[language]]
name = "astromotion-deck"
scope = "source.markdown"
grammar = "markdown"
language-servers = ["marksman", "nb-lsp"]
file-types = [{ glob = "*.deck.mdx" }, { glob = "**/decks/**/*.mdx" }]
auto-format = false

# Backlog.md task files: skip auto-format because the `backlog` CLI owns their
# serialisation --- it writes single-quoted YAML dates and unwrapped prose, so
# formatting one reflows the whole file and rewrites the quoting, turning a
# one-line edit into a 30-line diff the CLI will churn back. Every repo using
# Backlog.md already excludes `backlog/` in its .oxfmtrc.json, so this only
# teaches Helix what `pnpm format` and the claude-format hook already know.
# Highlighting/injections inherit from markdown via
# ~/.config/helix/runtime/queries/backlog-task/
[[language]]
name = "backlog-task"
scope = "source.markdown"
grammar = "markdown"
language-servers = ["marksman", "nb-lsp"]
file-types = [{ glob = "**/backlog/**/*.md" }]
auto-format = false

# mdx: separate from markdown so oxfmt sees the .mdx extension via
# --stdin-filepath and uses its MDX parser. Without this, oxfmt treats MDX
# expression containers as markdown emphasis and mangles single-line MDX
# comments like `{/* _class: hero */}`.
[[language]]
name = "mdx"
scope = "source.markdown"
grammar = "markdown"
language-servers = ["marksman", "nb-lsp"]
auto-format = true
file-types = ["mdx"]
formatter = { command = "oxfmt-helix", args = ["--stdin-filepath", "file.mdx"] }

[[language]]
name = "markdown"
language-servers = ["marksman", "nb-lsp"]
auto-format = true
file-types = [
  "md",
  "markdown",
  "mkd",
  "mkdn",
  "mdwn",
  "mdown",
  "markdn",
  "mdtxt",
  "mdtext",
  "workbook",
  { glob = "PULLREQ_EDITMSG" },
  { glob = "*.deck.svx" },
]
formatter = { command = "oxfmt-helix", args = ["--stdin-filepath", "file.md"] }

[[language]]
name = "latex"
auto-format = true
formatter = { command = "tex-fmt", args = ["--stdin"] }

[[language]]
name = "typst"
auto-format = true
formatter = { command = "typstyle", args = ["--wrap-text"] }

[[language]]
name = "toml"
auto-format = true
formatter = { command = "oxfmt-helix", args = [
  "--stdin-filepath",
  "file.toml",
] }

[[language]]
name = "kdl"
auto-format = true
formatter = { command = "kdlfmt", args = ["format", "-"] }

# astro: every Astro repo here checks `prettier --check '**/*.astro'` in CI,
# but prettier and prettier-plugin-astro are project-local devDependencies, so
# there's no global binary to name here. prettier-helix walks up from the
# buffer to the nearest node_modules/.bin/prettier and passes through when it
# finds none. Without this block Helix has no astro formatter at all, and
# every .astro edit ships unformatted and fails CI at the far end.
[[language]]
name = "astro"
auto-format = true
formatter = { command = "prettier-helix", args = ["%{buffer_name}"] }

[language-server.mutt-compose-lsp]
command = "mutt-compose-lsp"

[[language]]
name = "mutt-compose"
scope = "text.mutt-compose"
language-servers = ["mutt-compose-lsp"]
file-types = [{ glob = "neomutt-*" }]
text-width = 72
soft-wrap.enable = true

[[language]]
name = "muttrc"
scope = "source.muttrc"
file-types = ["muttrc", { glob = "*muttrc" }]

[[language]]
name = "extempore"
scope = "source.extempore"
file-types = ["xtm"]
comment-token = ";"
block-comment-tokens = { start = "#|", end = "|#" }
indent = { tab-width = 2, unit = "  " }

[[grammar]]
name = "extempore"
source = { git = "https://github.com/extemporelang/tree-sitter-extempore", rev = "cd9f1b5771be070fb3d2e8e16971bb5f9c031b53" }

# helix 25.07.1 pins gotmpl to dannylongeuay/tree-sitter-go-template, which has
# been deleted from GitHub, so `hx --grammar fetch` fails and the build dies
# with a misleading C-compiler error. Helix master already switched to the repo
# it was forked from; this override (same repo, same rev) is redundant once a
# release ships that fix.
[[grammar]]
name = "gotmpl"
source = { git = "https://github.com/ngalaiko/tree-sitter-go-template", rev = "aa71f63de226c5592dfbfc1f29949522d7c95fac" }

[[grammar]]
name = "mutt-compose"
source = { git = "https://github.com/benswift/tree-sitter-mutt-compose", rev = "c0558cc601b8407fe84907f230a7595fdece1836" }

# The upstream 0.1.4 tag omits generated src/parser.c, which Helix requires;
# this is the first main-branch commit after that release carrying it.
[[grammar]]
name = "muttrc"
source = { git = "https://github.com/neomutt/tree-sitter-muttrc", rev = "da8af7ba87b1bbe6d9e1606dfdc5eceb0fccc2dc" }
