# Debian installer answers for a kiosk thin client. render.py substitutes the
# @NAME@ placeholders with validated values; nothing else here varies per box.
#
# The install is deliberately bare: root locked, no desktop task, and no
# account but a throwaway "installer" (the installer insists on one) that
# late.sh deletes again. cloud-init creates the kiosk user and session on first
# boot from the NoCloud seed late.sh drops into the target, as on a Pi.

d-i debian-installer/locale string en_AU.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string
# The installer needs no firmware: the Wyse's Realtek NIC runs without it,
# and the installed system gets firmware-* from pkgsel below.
d-i hw-detect/load_firmware boolean false

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/non-free boolean false

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string
d-i passwd/username string installer
d-i passwd/user-password password @INSTALLER_PASSWORD@
d-i passwd/user-password-again password @INSTALLER_PASSWORD@

d-i clock-setup/utc boolean true
d-i time/zone string @TIMEZONE@
d-i clock-setup/ntp boolean true

# disk.sh picks the target disk (internal SATA/NVMe before the eMMC) and
# preseeds partman-auto/disk; the recipe is an ESP plus one ext4 root, with
# no swap partition to wear out the eMMC.
d-i partman/early_command string wget -q -O /tmp/disk.sh http://@SERVER@/disk.sh && sh /tmp/disk.sh
d-i partman-auto/method string regular
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string kiosk :: \
    538 538 1075 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
    4000 10000 -1 ext4 method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-auto/choose_recipe select kiosk
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

tasksel tasksel/first multiselect
d-i pkgsel/include string @PACKAGES@
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# The extra removable-path copy of GRUB is what Dell's firmware falls back to
# when it forgets the NVRAM boot entry.
d-i grub-installer/only_debian boolean true
d-i grub-installer/force-efi-extra-removable boolean true
d-i debian-installer/add-kernel-opts string cfg80211.ieee80211_regdom=@COUNTRY@

d-i preseed/late_command string wget -q -O /tmp/late.sh http://@SERVER@/late.sh && sh /tmp/late.sh http://@SERVER@
d-i finish-install/reboot_in_progress note
