# Served in place of grub.cfg once the install has finished, so a box whose
# firmware still boots the network first boots its disk instead of
# reinstalling. Chainloads the installed system's own loader rather than
# `exit`ing to the firmware: an exit has to make it back through shim, and
# OVMF at least then stops at its setup screen instead of trying the disk.
set timeout=0
search --no-floppy --file --set=root /EFI/debian/shimx64.efi
chainloader /EFI/debian/shimx64.efi
boot
