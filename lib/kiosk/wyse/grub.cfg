# Served over TFTP to a network-booting kiosk; replaced with installed.cfg once
# the install has finished, so a box whose firmware still boots the network
# first boots its disk instead of reinstalling.
set timeout=0
menuentry "kiosk install (@HOSTNAME@)" {
    linux /debian-installer/amd64/linux auto=true priority=critical url=http://@SERVER@/preseed.cfg hostname=@HOSTNAME@ domain= locale=en_AU.UTF-8 keymap=us interface=auto netcfg/dhcp_timeout=60 hw-detect/load_firmware=false --- quiet
    initrd /debian-installer/amd64/initrd.gz
}
