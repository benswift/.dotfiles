personality = "pragmatic"
project_doc_fallback_filenames = ["CLAUDE.md"]
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
service_tier = "default"

# Notify via Pushover when a turn takes at least five minutes. Codex sends the
# hook payload on stdin; bin/codex-turn-notify keeps the start time per turn.
[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "$HOME/.dotfiles/bin/codex-turn-notify start"
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "$HOME/.dotfiles/bin/codex-turn-notify stop"
timeout = 15

[tui]
alternate_screen = "never"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

